<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <circle cx="50" cy="50" r="48" fill="#f5f0e8" stroke="#7d9b76" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="44" stroke="#a8c0a0" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Stylized Loom and Artisan -->
  <g transform="translate(18, 16) scale(0.64)">
    <!-- Loom Base -->
    <path d="M10 75 L90 75" stroke="#8b7355" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 75 L80 75" stroke="#c4a482" stroke-width="6" stroke-linecap="round"/>
    <!-- Woven Mat Lines -->
    <path d="M25 68 L75 68" stroke="#d2b48c" stroke-width="2"/>
    <path d="M22 72 L78 72" stroke="#8b7355" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Artisan Figure -->
    <ellipse cx="50" cy="24" rx="9" ry="11" fill="#4a5247"/>
    <path d="M50 14 C42 14 38 20 40 28 C43 32 48 34 50 34 C52 34 57 32 60 28 C62 20 58 14 50 14 Z" fill="#2d3329"/>
    <!-- Hair Bun -->
    <circle cx="59" cy="22" r="5.5" fill="#2d3329"/>
    <!-- Torso and Saree Drape -->
    <path d="M38 34 C32 40 28 50 26 62 L74 62 C72 50 68 40 62 34 Z" fill="#7d9b76"/>
    <path d="M42 34 Q50 48 68 62 L60 62 Q46 46 38 34 Z" fill="#f5f0e8" opacity="0.9"/>
    <path d="M48 38 Q54 48 72 58" stroke="#c87d65" stroke-width="2.5" fill="none"/>
    <!-- Arms Weaving -->
    <path d="M33 46 Q42 56 46 64" stroke="#4a5247" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M67 46 Q58 56 54 64" stroke="#4a5247" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Subtle Botanical Leaves -->
  <path d="M14 62 C10 54 12 46 18 42 C18 48 16 56 14 62 Z" fill="#7d9b76"/>
  <path d="M86 62 C90 54 88 46 82 42 C82 48 84 56 86 62 Z" fill="#7d9b76"/>
  
  <!-- Text Ring -->
  <path id="curve" d="M 22 84 Q 50 96 78 84" fill="transparent"/>
  <text font-family="'Cormorant Garamond', serif" font-size="10" font-weight="700" fill="#2d3329" letter-spacing="2">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">
      SABARA
    </textPath>
  </text>
</svg>
